<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🧪 Teste Simples da API</h1>
    <button onclick="testHealth()">Teste Health</button>
    <button onclick="testCategories()">Teste Categorias</button>
    <button onclick="testLogin()">Teste Login</button>
    <button onclick="clearResults()">Limpar</button>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost:3001';
        
        function addResult(title, data, isError = false) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isError ? 'error' : 'success'}`;
            resultDiv.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultsDiv.appendChild(resultDiv);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/health`);
                const data = await response.json();
                addResult('✅ Health Check', data);
            } catch (error) {
                addResult('❌ Health Check Error', { error: error.message }, true);
            }
        }
        
        async function testCategories() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/categories`);
                const data = await response.json();
                addResult('✅ Categories', data);
            } catch (error) {
                addResult('❌ Categories Error', { error: error.message }, true);
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@hostdime.com',
                        password: 'admin123'
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                addResult('✅ Login', data);
            } catch (error) {
                addResult('❌ Login Error', { error: error.message }, true);
            }
        }
    </script>
</body>
</html>
